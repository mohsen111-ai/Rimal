name: Build Sahara APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Fenix build type (debug, nightly, beta, release)"
        default: "debug"
  push:
    branches: ["ccr-*", "main"]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "patches/**"
      - "overlay/**"
      - "UPSTREAM_VERSION"
      - "GECKOVIEW_VERSION"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Cache toolchains and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sahara-${{ hashFiles('UPSTREAM_VERSION', 'GECKOVIEW_VERSION') }}-${{ github.run_id }}
          restore-keys: |
            sahara-${{ hashFiles('UPSTREAM_VERSION', 'GECKOVIEW_VERSION') }}-

      - name: Build
        run: scripts/build.sh "${{ github.event.inputs.variant || 'debug' }}"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahara-apk
          path: dist/*.apk
          if-no-files-found: warn
